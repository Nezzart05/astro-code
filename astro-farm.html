<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Astro Garden — Astro Code</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#4fa84a;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
.hud{position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.pill{background:#1b2a4acc;border:2px solid #ffffff55;border-radius:14px;padding:5px 9px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(6px);text-shadow:0 1px 0 #0006}
.pill img{height:20px;width:auto;image-rendering:auto}
#camb{position:fixed;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 46px);display:flex;flex-direction:column;gap:6px}#camb button{width:40px;height:40px;border-radius:12px;border:2px solid #ffffff55;background:#1b2a4acc;color:#fff;font-size:17px;backdrop-filter:blur(6px)}#camb button:active{background:#ffcf5c88}
#sel{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 44px);background:#ffcf5cee;color:#2a1a00;border-radius:12px;padding:3px 12px;font-weight:900;font-size:13px;pointer-events:none;box-shadow:0 2px 0 #b07a10}
.panel{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#14233fdd;border:2px solid #ffffff44;border-radius:20px;padding:9px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#heard{font-size:12.5px;min-height:32px;padding:1px 5px 7px;line-height:1.35}
#heard b{color:#ffcf5c}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.chip{border:2px solid #ffffff3a;background:#ffffff18;color:#fff;border-radius:12px;padding:6px 1px;font-size:11px;line-height:1.25;font-weight:800;text-align:center;font-family:inherit}
.chip:active{background:#ffcf5c66;transform:scale(.97)}
.row{display:flex;gap:7px;margin-top:7px}
#txt{flex:1;min-width:0;background:#00000050;border:2px solid #ffffff2e;border-radius:12px;color:#fff;padding:9px 11px;font-size:14px;font-family:inherit;outline:none}
#mic{width:44px;border-radius:12px;border:0;background:linear-gradient(135deg,#ffcf5c,#ff8a3d);font-size:19px}
#mic.on{background:#ff4d6d;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.08)}}
#go{width:44px;border-radius:12px;border:2px solid #ffffff33;background:#ffffff14;color:#fff;font-size:17px}
#boot{position:fixed;inset:0;background:#2d6a3e;display:flex;align-items:center;justify-content:center;transition:opacity .8s;pointer-events:none;font-weight:900;letter-spacing:2px}

.panel{transition:transform .35s cubic-bezier(.3,.9,.3,1)}#chipwrap{overflow:hidden;max-height:150px;transition:max-height .3s ease,opacity .25s}.panel.hid #chipwrap{max-height:0;opacity:0}
#ptog{position:absolute;left:50%;top:-33px;transform:translateX(-50%);width:76px;height:32px;border-radius:14px 14px 0 0;border:2px solid #ffffff44;border-bottom:0;background:#14233fdd;color:#fff;font-size:15px;backdrop-filter:blur(12px)}
#h_inv{border:2px solid #ffffff55;font-size:18px;padding:3px 10px;pointer-events:auto;color:#fff}
.hud{pointer-events:none}.hud .pill{pointer-events:none}.hud #h_inv{pointer-events:auto}
#clock{position:fixed;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 44px);font-size:12.5px;pointer-events:none;transition:background .6s}#clock.night{background:#2a2060e6;border-color:#a99cff88}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}.modal.on{display:flex}
.card{width:min(92vw,420px);max-height:84vh;overflow:auto;background:#14233ff2;border:2px solid #ffffff55;border-radius:20px;padding:14px;backdrop-filter:blur(10px)}
.ttl{font-weight:900;font-size:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ttl button{background:#ffffff22;border:0;color:#fff;border-radius:10px;width:32px;height:32px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.it{background:#ffffff14;border:1px solid #ffffff22;border-radius:12px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}.it img{height:22px}.it b{font-size:16px}.it span{font-size:10.5px;opacity:.75}
.card h4{margin:14px 0 6px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.7}
.rec{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffff10;border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:12.5px}.rec small{opacity:.65}
.rec button,.boost{background:linear-gradient(135deg,#ffcf5c,#ff8a3d);border:0;border-radius:10px;color:#2a1a00;font-weight:800;padding:7px 11px;font-size:12px;font-family:inherit}
.boost{width:100%;margin-top:8px;padding:10px}.note{font-size:12px;opacity:.85;padding:3px 2px}.note.small{font-size:10.5px;opacity:.6}.note.ok{color:#9be97b;font-weight:800}
.pill.bump{animation:bump .32s}@keyframes bump{40%{transform:scale(1.32);background:#ffcf5ccc}}
#backapp{position:fixed;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 84px);z-index:15;background:#14233fdd;border:2px solid #ffffff44;border-radius:12px;color:#fff;font-weight:800;font-size:12.5px;padding:7px 11px;text-decoration:none}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="h_wood"></div><div class="pill" id="h_stone"></div><div class="pill" id="h_app"></div><button class="pill" id="h_inv">🎒</button></div>
<div id="clock" class="pill">☀ Day</div>
<div id="sel"></div>
<div id="camb"><button id="b_center" title="Recentrer">🎯</button><button id="b_all" title="Voir toute la ferme">🗺</button><button id="b_in">＋</button><button id="b_out">－</button><button id="b_skip" title="Test: skip to next day/night">🌗</button><button id="b_music" title="Music">🔊</button><button id="b_form" title="Team formation (demo)">🛡️</button></div>
<div class="panel" id="panel"><button id="ptog">▼</button>
 <div id="heard">Tap a creature to choose it, then say: <b>“shake the tree”</b></div>
 <div id="chipwrap"><div class="chips">
  <button class="chip" data-c="shake the tree">🍎<br>Shake</button><button class="chip" data-c="dig">⛏<br>Dig</button>
  <button class="chip" data-c="plant">🌱<br>Plant</button><button class="chip" data-c="water the plant">💧<br>Water</button><button class="chip" data-c="harvest">🌾<br>Harvest</button>
  <button class="chip" data-c="mine">💎<br>Mine</button><button class="chip" data-c="dance">💃<br>Dance</button>
  <button class="chip" data-c="roar">🦁<br>Roar</button><button class="chip" data-c="jump">⤴<br>Jump</button><button class="chip" data-c="come here">👋<br>Come</button>
 </div></div>
 <div class="row"><button id="mic">🎙</button><input id="txt" placeholder="or write: leo, dig then plant…" autocomplete="off"><button id="go">➤</button></div>
</div>
<div id="inv" class="modal"><div class="card"><div class="ttl">🎒 Inventory <button id="inv_x">✕</button></div><div id="invbody"></div></div></div>
<div id="boot">ASTRO GARDEN</div>
<a id="backapp" href="./index.html">← Astro Code</a>
<script>
fetch('farm-assets.json').then(r => r.json()).then(a => {
  window.__ASSETS__ = a;
  const s = document.createElement('script'); s.src = 'farm.js'; document.body.appendChild(s);
}).catch(e => { const b = document.getElementById('boot'); if (b) b.textContent = 'Astro Garden — could not load'; });
</script>
</body></html>
